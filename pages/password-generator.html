<html lang="en">

    <meta charset="UTF-8" />

    <link rel="stylesheet" href="../styling/password-generator.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar">
      <a href="../index.html"> <i class="fas fa-home"></i> HOME </a>
      <a href="./case-tracking.html">
        <i class="fas fa-tasks"></i> CASE TRACKING
      </a>
      <a href="./email-templates.html">
        <i class="fas fa-envelope"></i> EMAIL TEMPLATES
      </a>
      <a href="./password-generator.html" class="active">
        <i class="fas fa-key"></i> PASSWORD GENERATOR
      </a>
      <a href="./project-board.html">
        <i class="fas fa-project-diagram"></i> PROJECT BOARD
      </a>
      <a href="./documentation.html">
        <i class="fas fa-book"></i> DOCUMENTATION
      </a>
      <a href="./checklist.html">
        <i class="fas fa-check-square"></i> CHECKLIST

      <a href="./notes.html"> <i class="fas fa-sticky-note"></i> NOTES </a>
      <a href="./data-disposition.html">
        <i class="fas fa-database"></i> DATA DISPOSITION
      </a>
    </nav>
    <div id="password-generator" class="main-content">
      <div class="content-wrapper">
        <h1>Password Generator</h1>
        <div class="generator-container">
          <div class="length-control">
            <p>Password Length: <span id="length-value">16</span></p>
            <input
              type="range"
              id="length-slider"
              min="12"
              max="20"
              value="16"
            />
          </div>

          <div class="options">
            <label>
              <input type="checkbox" id="special-chars" checked />
              <span class="checkbox-label">
                <i class="fas fa-symbols"></i> Include Special Characters
              </span>
            </label>
          </div>

          <div class="password-display">
            <input
              type="text"
              id="password-output"
              readonly
              placeholder="Your secure password"
            />
            <button id="copy-btn" title="Copy to clipboard">
              <i class="fas fa-copy"></i>
            </button>
          </div>

          <button id="generate-btn">
            <i class="fas fa-sync-alt"></i> Generate Password
          </button>
        </div>
      </div>
    </div>

    <script src="../scripts/password-generator.js"></script>
  </body>
</html>
