<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documentation | GURU Discovery</title>
    <link rel="stylesheet" href="../styling/documentation.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar">
      <a href="../index.html"> <i class="fas fa-home"></i> HOME </a>
      <a href="./case-tracking.html">
        <i class="fas fa-tasks"></i> CASE TRACKING
      </a>
      <a href="./email-templates.html">
        <i class="fas fa-envelope"></i> EMAIL TEMPLATES
      </a>
      <a href="./password-generator.html">
        <i class="fas fa-key"></i> PASSWORD GENERATOR
      </a>
      <a href="./project-board.html">
        <i class="fas fa-project-diagram"></i> PROJECT BOARD
      </a>
      <a href="./documentation.html" class="active">
        <i class="fas fa-book"></i> DOCUMENTATION
      </a>
      <a href="./checklist.html">
        <i class="fas fa-check-square"></i> CHECKLIST
      </a>
      <a href="./notes.html"> <i class="fas fa-sticky-note"></i> NOTES </a>
      <a href="./data-disposition.html">
        <i class="fas fa-database"></i> DATA DISPOSITION
      </a>
    </nav>
    <div class="main-content">
      <h1>Documentation</h1>
      <div class="button-container">
        <button id="add-topic-btn" class="add-topic-btn">
          <i class="fas fa-plus"></i> Add Topic
        </button>
        <div class="import-export-buttons">
          <button
            id="export-docs-btn"
            class="secondary-btn"
            title="Export Documentation"
          >
            <i class="fas fa-download"></i>
          </button>
          <button
            id="import-docs-btn"
            class="secondary-btn"
            title="Import Documentation"
          >
            <i class="fas fa-upload"></i>
          </button>
        </div>
      </div>

      <div class="documentation-layout">
        <!-- Topics sidebar -->
        <div class="topics-sidebar">
          <h2>Topics</h2>
          <!-- Add search input -->
          <div class="topics-search">
            <input
              type="text"
              id="topics-filter"
              placeholder="Search topics..."
            />
            <i class="fas fa-search search-icon"></i>
          </div>
          <div id="topics-list" class="sortable-list"></div>
        </div>

        <!-- Content area -->
        <div class="content-area">
          <div id="topic-content" class="topic-content">
            <!-- Content will be loaded here -->
            <div class="empty-state">
              <i class="fas fa-book-open"></i>
              <p>Select a topic to view its content</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Add Topic Modal -->
      <div id="add-topic-modal" class="modal">
        <div class="modal-content">
          <span class="close"><i class="fas fa-times"></i></span>
          <h2>Add New Topic</h2>
          <form id="topic-form">
            <div class="form-group">
              <label for="topic-title">Topic Title:</label>
              <input type="text" id="topic-title" required />
            </div>
            <div class="form-group">
              <label for="topic-description">Description:</label>
              <textarea id="topic-description" required></textarea>
            </div>
            <div class="modal-buttons">
              <button type="button" class="cancel-btn">
                <i class="fas fa-times"></i> Cancel
              </button>
              <button type="submit" class="submit-btn">
                <i class="fas fa-save"></i> Save Topic
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Edit Content Modal -->
      <div id="edit-content-modal" class="modal">
        <div class="modal-content wide-modal">
          <button class="close" title="Close">
            <i class="fas fa-times"></i>
          </button>
          <h2>Edit Content</h2>
          <form id="content-form">
            <div class="rich-text-toolbar">
              <button type="button" data-command="bold" title="Bold">
                <i class="fas fa-bold"></i>
              </button>
              <button type="button" data-command="italic" title="Italic">
                <i class="fas fa-italic"></i>
              </button>
              <button type="button" data-command="underline" title="Underline">
                <i class="fas fa-underline"></i>
              </button>
              <div class="separator"></div>
              <button
                type="button"
                data-command="justifyLeft"
                title="Align Left"
              >
                <i class="fas fa-align-left"></i>
              </button>
              <button
                type="button"
                data-command="justifyCenter"
                title="Align Center"
              >
                <i class="fas fa-align-center"></i>
              </button>
              <button
                type="button"
                data-command="justifyRight"
                title="Align Right"
              >
                <i class="fas fa-align-right"></i>
              </button>
              <div class="separator"></div>
              <button
                type="button"
                data-command="insertUnorderedList"
                title="Bullet List"
              >
                <i class="fas fa-list-ul"></i>
              </button>
              <button
                type="button"
                data-command="insertOrderedList"
                title="Number List"
              >
                <i class="fas fa-list-ol"></i>
              </button>
              <div class="separator"></div>
              <button
                type="button"
                class="image-upload-btn"
                title="Insert Image"
              >
                <i class="fas fa-image"></i>
              </button>
              <input
                type="file"
                id="toolbar-image-upload"
                accept="image/*"
                hidden
              />
            </div>
            <div
              id="rich-text-editor"
              class="rich-text-content"
              contenteditable="true"
            ></div>

            <div class="modal-buttons">
              <button type="button" class="cancel-btn">
                <i class="fas fa-times"></i> Cancel
              </button>
              <button type="submit" class="submit-btn">
                <i class="fas fa-save"></i> Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="../scripts/documentation.js"></script>
    <!-- Sortable.js -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  </body>
</html>
