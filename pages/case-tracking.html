<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case Tracking | GURU Discovery</title>
    <link rel="stylesheet" href="../styling/case-tracking.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar">
      <a href="../index.html"> <i class="fas fa-home"></i> HOME </a>
      <a href="./case-tracking.html" class="active">
        <i class="fas fa-tasks"></i> CASE TRACKING
      </a>
      <a href="./email-templates.html">
        <i class="fas fa-envelope"></i> EMAIL TEMPLATES
      </a>
      <a href="./password-generator.html">
        <i class="fas fa-key"></i> PASSWORD GENERATOR
      </a>
      <a href="./project-board.html">
        <i class="fas fa-project-diagram"></i> PROJECT BOARD
      </a>
      <a href="./documentation.html">
        <i class="fas fa-book"></i> DOCUMENTATION
      </a>
      <a href="./checklist.html">
        <i class="fas fa-check-square"></i> CHECKLIST
      </a>
      <a href="./notes.html"> <i class="fas fa-sticky-note"></i> NOTES </a>
      <a href="./data-disposition.html">
        <i class="fas fa-database"></i> DATA DISPOSITION
      </a>
    </nav>
    <div id="case-tracking" class="main-content">
      <h1>Case Tracking</h1>
      <div class="button-container">
        <button id="add-case-btn" class="add-case-btn">
          <i class="fas fa-plus"></i> Add Case
        </button>
        <button
          id="export-btn"
          class="action-btn export-btn"
          title="Export Cases"
        >
          <i class="fas fa-file-export"></i>
        </button>
        <button
          id="import-btn"
          class="action-btn import-btn"
          title="Import Cases"
        >
          <i class="fas fa-file-import"></i>
        </button>
      </div>

      <!-- Cases Container -->
      <div id="cases-container"></div>

      <!-- Add Case Modal -->
      <div id="add-case-modal" class="modal">
        <div class="modal-content">
          <span class="close"><i class="fas fa-times"></i></span>
          <h2>Add New Case</h2>
          <form id="case-form">
            <div class="form-group">
              <label for="caption">Caption:</label>
              <input type="text" id="caption" required />
            </div>
            <div class="form-group">
              <label for="matter-number">Matter Number:</label>
              <input type="text" id="matter-number" required />
            </div>
            <div class="form-group">
              <label for="client">Client:</label>
              <select id="client" required>
                <option value="">Select a client</option>
                <option value="Adams Leclair">Adams Leclair</option>
                <option value="Xerox">Xerox</option>
                <option value="Quinn Emanuel">Quinn Emanuel</option>
                <option value="Brown Rudnick">Brown Rudnick</option>
              </select>
            </div>
            <div class="modal-buttons">
              <button type="button" id="cancel-btn" class="cancel-btn">
                <i class="fas fa-times"></i> Cancel
              </button>
              <button type="submit" id="submit-btn" class="submit-btn" disabled>
                <i class="fas fa-save"></i> Submit
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Edit Case Modal -->
      <div id="edit-modal" class="modal">
        <div class="modal-content">
          <span class="close"><i class="fas fa-times"></i></span>
          <h2>Edit Case</h2>
          <form id="edit-case-form">
            <div class="form-group">
              <label for="edit-caption">Caption:</label>
              <input type="text" id="edit-caption" required />
            </div>
            <div class="form-group">
              <label for="edit-matter-number">Matter Number:</label>
              <input type="text" id="edit-matter-number" required />
            </div>
            <div class="form-group">
              <label for="edit-client">Client:</label>
              <select id="edit-client" required>
                <option value="">Select a client</option>
                <option value="Adams Leclair">Adams Leclair</option>
                <option value="Xerox">Xerox</option>
                <option value="Quinn Emanuel">Quinn Emanuel</option>
                <option value="Brown Rudnick">Brown Rudnick</option>
              </select>
            </div>
            <div class="modal-buttons">
              <button type="button" class="cancel-btn">
                <i class="fas fa-times"></i> Cancel
              </button>
              <button type="submit" class="save-btn">
                <i class="fas fa-save"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Delete Confirmation Modal -->
      <div id="delete-confirm-modal" class="modal">
        <div class="modal-content delete-modal">
          <div class="delete-modal-header">
            <i class="fas fa-exclamation-triangle warning-icon"></i>
            <h2>Delete Case</h2>
          </div>
          <p>Are you sure you want to delete this case?</p>
          <p class="delete-warning">This action cannot be undone.</p>
          <div class="modal-buttons">
            <button id="cancel-delete-btn" class="cancel-btn">
              <i class="fas fa-times"></i> Cancel
            </button>
            <button id="confirm-delete-btn" class="delete-btn">
              <i class="fas fa-trash"></i> Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../scripts/case-tracking.js"></script>
  </body>
</html>
