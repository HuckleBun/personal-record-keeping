<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Disposition | GURU Discovery</title>
    <link rel="stylesheet" href="../styling/data-disposition.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar">
      <a href="../index.html"> <i class="fas fa-home"></i> HOME </a>
      <a href="./case-tracking.html">
        <i class="fas fa-tasks"></i> CASE TRACKING
      </a>
      <a href="./email-templates.html">
        <i class="fas fa-envelope"></i> EMAIL TEMPLATES
      </a>
      <a href="./password-generator.html">
        <i class="fas fa-key"></i> PASSWORD GENERATOR
      </a>
      <a href="./project-board.html">
        <i class="fas fa-project-diagram"></i> PROJECT BOARD
      </a>
      <a href="./documentation.html">
        <i class="fas fa-book"></i> DOCUMENTATION
      </a>
      <a href="./checklist.html">
        <i class="fas fa-check-square"></i> CHECKLIST
      </a>
      <a href="./notes.html"> <i class="fas fa-sticky-note"></i> NOTES </a>
      <a href="./data-disposition.html" class="active">
        <i class="fas fa-database"></i> DATA DISPOSITION
      </a>
    </nav>
    <div class="main-content">
      <h1>Data Disposition</h1>
      <div class="button-container">
        <button id="add-case-btn" class="add-case-btn">
          <i class="fas fa-plus"></i> Add Case
        </button>
        <div class="filter-container">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="case-filter"
            placeholder="Filter cases by name..."
            class="filter-input"
          />
        </div>
      </div>

      <div id="cases-container" class="cases-container">
        <!-- Cases will be added here -->
      </div>

      <!-- Add Case Modal -->
      <div id="add-case-modal" class="modal">
        <div class="modal-content">
          <span class="close"><i class="fas fa-times"></i></span>
          <h2>Add New Case</h2>
          <form id="case-form">
            <div class="form-group">
              <label for="case-name">Case Name:</label>
              <input type="text" id="case-name" required />
            </div>
            <div class="form-group client-group">
              <label for="client-select">Client:</label>
              <div class="client-input-group">
                <select id="client-select" required>
                  <option value="">Select client</option>
                </select>
                <button
                  type="button"
                  class="add-client-btn"
                  title="Add New Client"
                >
                  <i class="fas fa-plus"></i>
                </button>
                <button
                  type="button"
                  class="remove-client-btn"
                  title="Remove Selected Client"
                >
                  <i class="fas fa-minus"></i>
                </button>
              </div>
            </div>
            <div class="form-group">
              <label for="admin-data">Administrative Data:</label>
              <select id="admin-data" required>
                <option value="">Select option</option>
                <option value="Return To Client">Return To Client</option>
                <option value="Nearline Storage">Nearline Storage</option>
                <option value="Destroy">Destroy</option>
              </select>
            </div>
            <div class="form-group">
              <label for="original-data">Original Collected Data:</label>
              <select id="original-data" required>
                <option value="">Select option</option>
                <option value="Return To Client">Return To Client</option>
                <option value="Nearline Storage">Nearline Storage</option>
                <option value="Destroy">Destroy</option>
              </select>
            </div>
            <div class="form-group">
              <label>Delivery Method:</label>
              <div class="radio-group">
                <label class="radio-label">
                  <input type="radio" name="delivery" value="FTP" required />
                  FTP
                </label>
                <label class="radio-label">
                  <input type="radio" name="delivery" value="Mail" required />
                  Mail
                </label>
              </div>
            </div>
            <div class="form-group">
              <label for="case-file">Upload File:</label>
              <div class="file-upload">
                <input type="file" id="case-file" required />
                <label for="case-file" class="file-label">
                  <i class="fas fa-cloud-upload-alt"></i>
                  <span>Choose a file</span>
                </label>
              </div>
            </div>
            <div class="modal-buttons">
              <button type="button" class="cancel-btn">
                <i class="fas fa-times"></i> Cancel
              </button>
              <button type="submit" class="submit-btn" disabled>
                <i class="fas fa-save"></i> Submit Case
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- View Case Modal -->
      <div id="view-case-modal" class="modal">
        <div class="modal-content">
          <span class="close"><i class="fas fa-times"></i></span>
          <h2 id="view-case-name"></h2>
          <div class="case-details">
            <div class="detail-group">
              <label>Administrative Data:</label>
              <span id="view-admin-data"></span>
            </div>
            <div class="detail-group">
              <label>Original Collected Data:</label>
              <span id="view-original-data"></span>
            </div>
            <div class="detail-group">
              <label>Delivery Method:</label>
              <span id="view-delivery"></span>
            </div>
            <div class="detail-group">
              <label>File:</label>
              <div class="file-actions">
                <span id="view-filename"></span>
                <button id="download-file" class="download-btn">
                  <i class="fas fa-download"></i> Download
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Delete Confirmation Modal -->
      <div id="delete-confirm-modal" class="modal">
        <div class="modal-content delete-modal">
          <h2><i class="fas fa-exclamation-triangle"></i> Delete Case</h2>
          <p>Are you sure you want to delete this case?</p>
          <div class="modal-buttons">
            <button id="cancel-delete-btn" class="cancel-btn">
              <i class="fas fa-times"></i> Cancel
            </button>
            <button id="confirm-delete-btn" class="delete-btn">
              <i class="fas fa-trash"></i> Delete
            </button>
          </div>
        </div>
      </div>

      <!-- Add Client Modal -->
      <div id="add-client-modal" class="modal">
        <div class="modal-content">
          <span class="close"><i class="fas fa-times"></i></span>
          <h2>Add New Client</h2>
          <div class="form-group">
            <label for="new-client-name">Client Name:</label>
            <input type="text" id="new-client-name" required />
          </div>
          <div class="modal-buttons">
            <button type="button" class="cancel-btn">
              <i class="fas fa-times"></i> Cancel
            </button>
            <button type="button" id="confirm-add-client" class="submit-btn">
              <i class="fas fa-save"></i> Add Client
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../scripts/data-disposition.js"></script>
  </body>
</html>
