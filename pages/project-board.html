<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Board | GURU Discovery</title>
    <link rel="stylesheet" href="../styling/project-board.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar">
      <a href="../index.html"> <i class="fas fa-home"></i> HOME </a>
      <a href="./case-tracking.html">
        <i class="fas fa-tasks"></i> CASE TRACKING
      </a>
      <a href="./email-templates.html">
        <i class="fas fa-envelope"></i> EMAIL TEMPLATES
      </a>
      <a href="./password-generator.html">
        <i class="fas fa-key"></i> PASSWORD GENERATOR
      </a>
      <a href="./project-board.html" class="active">
        <i class="fas fa-project-diagram"></i> PROJECT BOARD
      </a>
      <a href="./documentation.html">
        <i class="fas fa-book"></i> DOCUMENTATION
      </a>
      <a href="./checklist.html">
        <i class="fas fa-check-square"></i> CHECKLIST
      </a>
      <a href="./notes.html"> <i class="fas fa-sticky-note"></i> NOTES </a>
      <a href="./data-disposition.html">
        <i class="fas fa-database"></i> DATA DISPOSITION
      </a>
    </nav>
    <main class="main-content">
      <h1>Project Board</h1>
      <div class="add-task-container">
        <input
          type="text"
          id="taskInput"
          placeholder="What needs to be done?"
          autocomplete="off"
        />
        <select id="taskPriority">
          <option value="low">Low Priority</option>
          <option value="medium">Medium Priority</option>
          <option value="high">High Priority</option>
        </select>
        <button id="addTask"><i class="fas fa-plus"></i> Add Task</button>
      </div>
      <div class="board-container">
        <div class="column" id="todo">
          <h2>To Do</h2>
          <div
            class="task-list"
            ondrop="drop(event)"
            ondragover="allowDrop(event)"
          ></div>
        </div>
        <div class="column" id="inProgress">
          <h2>In Progress</h2>
          <div
            class="task-list"
            ondrop="drop(event)"
            ondragover="allowDrop(event)"
          ></div>
        </div>
        <div class="column" id="complete">
          <h2>Complete</h2>
          <div
            class="task-list"
            ondrop="drop(event)"
            ondragover="allowDrop(event)"
          ></div>
        </div>
        <div class="column" id="notes">
          <h2>Notes</h2>
          <div
            class="task-list"
            ondrop="drop(event)"
            ondragover="allowDrop(event)"
          ></div>
        </div>
      </div>
    </main>
    <script src="../scripts/project-board.js"></script>
  </body>
</html>
